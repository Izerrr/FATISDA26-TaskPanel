<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="c2-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>
    <linearGradient id="c2-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="c2-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="c2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0077B6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#c2-bg)" />
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.2" />

  <g id="icon" filter="url(#c2-shadow)">
    <!-- Base Academic Shield / Outer Panel -->
    <path d="M 256 96 C 330 96 392 112 392 144 C 392 272 328 368 256 416 C 184 368 120 272 120 144 C 120 112 182 96 256 96 Z" fill="url(#c2-left)" opacity="0.3" />

    <!-- Left Wing -->
    <path d="M 256 112 L 140 152 C 140 264 196 348 256 392 L 256 288 L 208 240 L 236 212 L 256 232 Z" fill="url(#c2-left)" />

    <!-- Right Wing -->
    <path d="M 256 112 L 372 152 C 372 264 316 348 256 392 L 256 288 L 332 208 L 304 180 L 256 232 Z" fill="url(#c2-right)" />

    <!-- Bold Central Checkmark Floating Forward -->
    <path d="M 196 244 L 246 294 C 252 300 260 300 266 294 L 356 196 C 364 186 362 172 352 164 C 342 156 328 158 320 168 L 256 240 L 226 210 C 218 202 204 202 196 210 C 188 218 188 234 196 244 Z" fill="url(#c2-check)" />

    <!-- Top Academic Apex Star/Diamond -->
    <polygon points="256,76 266,92 282,96 266,100 256,116 246,100 230,96 246,92" fill="#38BDF8" />
  </g>
</svg>

