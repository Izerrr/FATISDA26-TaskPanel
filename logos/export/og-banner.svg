<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="50%" stop-color="#070E1B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Radial Glow Behind Logo -->
    <radialGradient id="og-glow" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="og-glow-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="og-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>

    <linearGradient id="og-back-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0077B6" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="og-main-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <linearGradient id="og-check-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="og-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2F2FF" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="og-logo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0284C7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="og-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#03071E" flood-opacity="0.35" />
    </filter>

    <filter id="og-check-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />
  <rect width="1200" height="630" fill="url(#og-glow-left)" />

  <!-- Subtle Grid Accent Lines -->
  <g stroke="#38BDF8" stroke-width="1" stroke-opacity="0.06">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Outer Glass Border -->
  <rect x="24" y="24" width="1152" height="582" rx="36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.18" />

  <!-- LEFT COLUMN: BRAND & VALUE PROP -->
  <g transform="translate(84, 96)">
    <!-- University & Faculty Tag Pill -->
    <g>
      <rect x="0" y="0" width="370" height="42" rx="21" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />
      <circle cx="24" cy="21" r="5" fill="#38BDF8" />
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.2">FATISDA UNS • ANGKATAN 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="url(#og-title-grad)" letter-spacing="-2">TaskPanel</text>

    <!-- Catchy Headline -->
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#38BDF8" letter-spacing="-0.3">All-in-One Academic &amp; Task Workspace</text>

    <!-- Subtitle Description -->
    <text x="0" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      <tspan x="0" dy="0">Platform resmi mahasiswa Fakultas Teknologi Informasi dan Sains Data.</tspan>
      <tspan x="0" dy="28">Kelola tugas kuliah, jadwal harian, jadwal ujian UTS/UAS, &amp; course vault.</tspan>
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: Tugas & Kanban -->
      <g>
        <rect x="0" y="0" width="170" height="40" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">📋 Tugas &amp; Kanban</text>
      </g>
      <!-- Badge 2: Jadwal UTS / UAS -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="195" height="40" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">🎓 Jadwal Kuliah &amp; UTS</text>
      </g>
      <!-- Badge 3: Vault Materi -->
      <g transform="translate(389, 0)">
        <rect x="0" y="0" width="165" height="40" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">📚 Vault &amp; Diskusi</text>
      </g>
    </g>

    <!-- Bottom Status / URL Indicator -->
    <g transform="translate(0, 400)">
      <circle cx="8" cy="8" r="6" fill="#10B981" />
      <circle cx="8" cy="8" r="10" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="28" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B">fatisda26-taskpanel.vercel.app</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 3D FLOATING HERO LOGO -->
  <g transform="translate(730, 115) scale(0.85)" filter="url(#og-logo-shadow)">
    <!-- Base Squircle -->
    <rect width="450" height="450" rx="112" fill="url(#og-logo-bg)" />
    <rect x="4" y="4" width="442" height="442" rx="108" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.35" />

    <!-- Back Panel -->
    <rect x="156" y="80" width="190" height="240" rx="36" fill="url(#og-back-card)" transform="rotate(8 251 200)" />

    <!-- Main Front Card Canvas -->
    <g filter="url(#og-card-shadow)">
      <rect x="100" y="90" width="250" height="286" rx="40" fill="url(#og-main-card)" />
      <rect x="101" y="91" width="248" height="284" rx="39" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8" />

      <!-- Top clip pill -->
      <rect x="170" y="74" width="110" height="32" rx="16" fill="#0284C7" />
      <rect x="206" y="84" width="38" height="11" rx="5.5" fill="#BAE6FD" />

      <!-- Minimal lines -->
      <rect x="140" y="148" width="170" height="12" rx="6" fill="#E2E8F0" />
      <rect x="140" y="178" width="110" height="12" rx="6" fill="#E2E8F0" />
      <rect x="140" y="328" width="170" height="10" rx="5" fill="#F1F5F9" />
    </g>

    <!-- Bold Vibrant Checkmark Leaping Forward -->
    <g filter="url(#og-check-shadow)">
      <path d="M 164 242 L 214 292 C 220 298 230 298 238 292 L 332 182 C 342 172 340 156 330 148 C 318 138 304 140 294 150 L 226 234 L 194 202 C 184 192 170 192 160 202 C 150 212 150 228 164 242 Z" fill="url(#og-check-grad)" />
    </g>

    <!-- Sparkle dot -->
    <circle cx="330" cy="120" r="9" fill="#38BDF8" />
  </g>
</svg>

